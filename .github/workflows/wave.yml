name: Contribution Wave

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Contribution Wave SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime, timezone

          user  = os.environ["GITHUB_USER"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          resp = requests.post(
            "https://api.github.com/graphql",
            json={"query": query, "variables": {"login": user}},
            headers={"Authorization": f"Bearer {token}"}
          ).json()

          cal  = resp["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [
            day
            for week in cal["weeks"]
            for day in week["contributionDays"]
          ]

          counts = [d["contributionCount"] for d in days]
          peak   = max(counts) if counts else 1

          GH_GREENS = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]

          def gh_color(count):
            if count == 0:    return GH_GREENS[0]
            ratio = count / peak
            if ratio <= 0.25: return GH_GREENS[1]
            if ratio <= 0.50: return GH_GREENS[2]
            if ratio <= 0.75: return GH_GREENS[3]
            return GH_GREENS[4]

          W, H     = 900, 180
          WAVE_H   = 120
          TOP_PAD  = 10
          n        = len(counts)
          step     = W / max(n - 1, 1)

          def y_for(count):
            ratio = count / peak
            return TOP_PAD + WAVE_H * (1 - ratio)

          pts = [(i * step, y_for(c)) for i, c in enumerate(counts)]

          def smooth_path(pts):
            if not pts:
              return ""
            d = f"M {pts[0][0]:.2f},{pts[0][1]:.2f}"
            for i in range(1, len(pts)):
              x0, y0 = pts[i - 1]
              x1, y1 = pts[i]
              cx = (x0 + x1) / 2
              d += f" C {cx:.2f},{y0:.2f} {cx:.2f},{y1:.2f} {x1:.2f},{y1:.2f}"
            return d

          wave_d     = smooth_path(pts)
          baseline_y = TOP_PAD + WAVE_H
          fill_d     = wave_d + f" L {W},{baseline_y} L 0,{baseline_y} Z"

          # Month labels
          month_labels = []
          seen_months  = set()
          for i, day in enumerate(days):
            m = day["date"][5:7]
            if m not in seen_months:
              seen_months.add(m)
              label = datetime.fromisoformat(day["date"]).strftime("%b")
              x     = i * step
              month_labels.append((x, label))

          month_svg = "".join(
            f'<text x="{x:.1f}" y="{TOP_PAD + WAVE_H + 26}" '
            f'text-anchor="middle" font-size="11" font-family="sans-serif" fill="#94a3b8">{lbl}</text>'
            for x, lbl in month_labels
          )

          # Horizontal gradient stops
          NUM_STOPS = 20
          seg_size  = max(1, n // NUM_STOPS)
          grad_stops = ""
          for s in range(NUM_STOPS + 1):
            idx   = min(s * seg_size, n - 1)
            pct   = round(s * 100 / NUM_STOPS)
            color = gh_color(counts[idx])
            grad_stops += f'<stop offset="{pct}%" stop-color="{color}" stop-opacity="0.9"/>\n            '

          # Pulse oximeter effect:
          # A ~3-month wide window (25% of W) of bright wave slides continuously
          # across the full year path, looping forever with no pause at the edge.
          # Leading edge = bright, trailing edge = fades to dim.
          # Implemented via a moving linearGradient mask:
          #   left of window  -> 0 opacity (dim base handles it)
          #   window          -> 1 opacity
          #   right of window -> 0 opacity
          # The gradient x1/x2 animates in gradientUnits="userSpaceOnUse".

          # Window width in px (~3 months out of 12)
          WIN = round(W * 0.25)   # 225px
          DURATION = "5s"

          # We animate the gradient from starting fully off-left to ending fully off-right.
          # Start: window right edge at x=0  -> x1 = -WIN, x2 = 0
          # End:   window left  edge at x=W  -> x1 = W,    x2 = W + WIN
          # Total travel = W + WIN

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
               width="{W}" height="{H}"
               viewBox="0 0 {W} {H}">

            <defs>
              <!-- Horizontal density gradient (full width) -->
              <linearGradient id="waveHoriz" x1="0" y1="0" x2="1" y2="0">
                {grad_stops}
              </linearGradient>

              <!-- Vertical fade -->
              <linearGradient id="waveFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="white" stop-opacity="1"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
              </linearGradient>

              <mask id="fadeMask">
                <rect width="{W}" height="{H}" fill="url(#waveFade)"/>
              </mask>

              <!-- Sliding window mask: bright band moves left→right continuously -->
              <linearGradient id="slideGrad" x1="{-WIN}" y1="0" x2="0" y2="0"
                              gradientUnits="userSpaceOnUse">
                <stop offset="0%"   stop-color="black" stop-opacity="0"/>
                <stop offset="40%"  stop-color="white" stop-opacity="1"/>
                <stop offset="60%"  stop-color="white" stop-opacity="1"/>
                <stop offset="100%" stop-color="black" stop-opacity="0"/>
                <animateTransform
                  attributeName="gradientTransform"
                  type="translate"
                  values="{-WIN} 0;{W + WIN} 0"
                  dur="{DURATION}"
                  repeatCount="indefinite"
                  calcMode="linear"/>
              </linearGradient>

              <mask id="slideMask">
                <rect x="{-WIN}" y="0" width="{W + WIN * 2}" height="{H}"
                      fill="url(#slideGrad)"/>
              </mask>

              <!-- Glow filter -->
              <filter id="glow" x="-5%" y="-60%" width="110%" height="220%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

            </defs>

            <!-- Dim ghost wave always visible underneath -->
            <g opacity="0.15" mask="url(#fadeMask)">
              <path d="{fill_d}" fill="url(#waveHoriz)"/>
              <path d="{wave_d}" fill="none" stroke="#39d353" stroke-width="1.5" stroke-linejoin="round"/>
            </g>

            <!-- Bright sliding window wave -->
            <g mask="url(#slideMask)">
              <path d="{fill_d}" fill="url(#waveHoriz)" mask="url(#fadeMask)"/>
              <path d="{wave_d}"
                    fill="none"
                    stroke="#39d353"
                    stroke-width="2.5"
                    stroke-linejoin="round"
                    filter="url(#glow)"/>
            </g>

            <!-- Month labels -->
            {month_svg}

          </svg>"""

          os.makedirs("dist", exist_ok=True)
          with open("dist/contribution-wave.svg", "w") as f:
            f.write(svg)

          print(f"Wave SVG generated — {n} days, peak={peak}")
          EOF

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution wave [skip ci]"
