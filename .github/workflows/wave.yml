name: Contribution Wave

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Contribution Wave SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime, timezone

          user  = os.environ["GITHUB_USER"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          resp = requests.post(
            "https://api.github.com/graphql",
            json={"query": query, "variables": {"login": user}},
            headers={"Authorization": f"Bearer {token}"}
          ).json()

          cal  = resp["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [
            day
            for week in cal["weeks"]
            for day in week["contributionDays"]
          ]

          counts = [d["contributionCount"] for d in days]
          peak   = max(counts) if counts else 1

          GH_GREENS = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]

          def gh_color(count):
            if count == 0:       return GH_GREENS[0]
            ratio = count / peak
            if ratio <= 0.25:    return GH_GREENS[1]
            if ratio <= 0.50:    return GH_GREENS[2]
            if ratio <= 0.75:    return GH_GREENS[3]
            return GH_GREENS[4]

          # SVG dimensions
          W, H      = 900, 180
          WAVE_H    = 120
          TOP_PAD   = 10
          BOT_PAD   = 40   # space for month labels
          n         = len(counts)
          step      = W / max(n - 1, 1)

          def y_for(count):
            ratio = count / peak
            return TOP_PAD + WAVE_H * (1 - ratio)

          pts = [(i * step, y_for(c)) for i, c in enumerate(counts)]

          def smooth_path(pts):
            if not pts:
              return ""
            d = f"M {pts[0][0]:.2f},{pts[0][1]:.2f}"
            for i in range(1, len(pts)):
              x0, y0 = pts[i - 1]
              x1, y1 = pts[i]
              cx = (x0 + x1) / 2
              d += f" C {cx:.2f},{y0:.2f} {cx:.2f},{y1:.2f} {x1:.2f},{y1:.2f}"
            return d

          wave_d     = smooth_path(pts)
          baseline_y = TOP_PAD + WAVE_H
          fill_d     = wave_d + f" L {W},{baseline_y} L 0,{baseline_y} Z"

          # Month labels
          month_labels = []
          seen_months  = set()
          for i, day in enumerate(days):
            m = day["date"][5:7]
            if m not in seen_months:
              seen_months.add(m)
              label = datetime.fromisoformat(day["date"]).strftime("%b")
              x     = i * step
              month_labels.append((x, label))

          month_svg = "".join(
            f'<text x="{x:.1f}" y="{TOP_PAD + WAVE_H + 26}" '
            f'text-anchor="middle" font-size="11" font-family="sans-serif" fill="#94a3b8">{lbl}</text>'
            for x, lbl in month_labels
          )

          # Horizontal gradient stops based on contribution density
          NUM_STOPS = 20
          seg_size  = max(1, n // NUM_STOPS)
          grad_stops = ""
          for s in range(NUM_STOPS + 1):
            idx   = min(s * seg_size, n - 1)
            pct   = round(s * 100 / NUM_STOPS)
            color = gh_color(counts[idx])
            grad_stops += f'<stop offset="{pct}%" stop-color="{color}" stop-opacity="0.9"/>\n            '

          # The pulse oximeter effect:
          # A vertical "scanner" line sweeps left to right continuously,
          # revealing the wave as it passes — exactly like a heart monitor drawing itself.
          # We achieve this with a clipPath whose rect animates its width from 0 to W,
          # then instantly resets — giving the drawing/sweeping illusion.
          # A bright dot rides the wave top at the scanner position.
          # Duration: 6s for one full sweep across the year.

          DURATION = "6s"

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
               width="{W}" height="{H}"
               viewBox="0 0 {W} {H}">

            <defs>
              <!-- Horizontal density gradient -->
              <linearGradient id="waveHoriz" x1="0" y1="0" x2="1" y2="0">
                {grad_stops}
              </linearGradient>

              <!-- Vertical fade: solid at top, transparent at bottom -->
              <linearGradient id="waveFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="white" stop-opacity="1"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
              </linearGradient>

              <mask id="fadeMask">
                <rect width="{W}" height="{H}" fill="url(#waveFade)"/>
              </mask>

              <!-- Glow for the wave stroke -->
              <filter id="glow" x="-5%" y="-60%" width="110%" height="220%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Bright glow for the scanning dot -->
              <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Clip that sweeps left→right to reveal the wave -->
              <clipPath id="sweepClip">
                <rect id="sweepRect" x="0" y="0" width="0" height="{H}">
                  <animate
                    attributeName="width"
                    values="0;{W};{W};0"
                    keyTimes="0;0.85;0.99;1"
                    dur="{DURATION}"
                    repeatCount="indefinite"
                    calcMode="linear"/>
                </rect>
              </clipPath>

              <!-- Trailing fade behind the scanner (dark overlay that fades the old wave) -->
              <linearGradient id="trailFade" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
              </linearGradient>

            </defs>

            <!-- Dim base wave (always visible, faded) -->
            <g opacity="0.18" mask="url(#fadeMask)">
              <path d="{fill_d}" fill="url(#waveHoriz)"/>
              <path d="{wave_d}" fill="none" stroke="#39d353" stroke-width="1.5" stroke-linejoin="round"/>
            </g>

            <!-- Bright revealed wave (clipped to swept region) -->
            <g clip-path="url(#sweepClip)">
              <path d="{fill_d}" fill="url(#waveHoriz)" mask="url(#fadeMask)">
                <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
              </path>
              <path d="{wave_d}"
                    fill="none"
                    stroke="#39d353"
                    stroke-width="2.5"
                    stroke-linejoin="round"
                    filter="url(#glow)"/>
            </g>

            <!-- Scanning dot that rides along the wave top -->
            <!-- We use a circle whose cx animates 0→W in sync with the sweep,
                 and cy is fixed at a mid-wave height since SVG can't compute path position.
                 The dot glows brightly to simulate the "drawing head". -->
            <circle r="5" fill="#39d353" filter="url(#dotglow)" opacity="0.95">
              <animate attributeName="cx"
                       values="0;{W};{W};0"
                       keyTimes="0;0.85;0.99;1"
                       dur="{DURATION}"
                       repeatCount="indefinite"
                       calcMode="linear"/>
              <!-- cy follows an approximate sine to loosely track the wave -->
              <animate attributeName="cy"
                       values="{';'.join(f'{y_for(counts[int(i*(n-1)/60)]):.1f}' for i in range(61))}"
                       keyTimes="{';'.join(f'{i/60*0.85:.4f}' for i in range(61))}"
                       dur="{DURATION}"
                       repeatCount="indefinite"
                       calcMode="linear"
                       fill="freeze"/>
            </circle>

            <!-- Month labels (always visible) -->
            {month_svg}

          </svg>"""

          os.makedirs("dist", exist_ok=True)
          with open("dist/contribution-wave.svg", "w") as f:
            f.write(svg)

          print(f"Wave SVG generated — {n} days, peak={peak}")
          EOF

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution wave [skip ci]"
