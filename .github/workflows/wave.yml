name: Contribution Wave

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Contribution Wave SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime, timezone

          user  = os.environ["GITHUB_USER"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          resp = requests.post(
            "https://api.github.com/graphql",
            json={"query": query, "variables": {"login": user}},
            headers={"Authorization": f"Bearer {token}"}
          ).json()

          cal   = resp["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days  = [
            day
            for week in cal["weeks"]
            for day in week["contributionDays"]
          ]

          counts = [d["contributionCount"] for d in days]
          peak   = max(counts) if counts else 1

          # GitHub green palette: 0 commits -> lightest, peak -> darkest
          # matches GitHub's contribution graph colors
          GH_GREENS = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]

          def gh_color(count):
            if count == 0:
              return GH_GREENS[0]
            ratio = count / peak
            if ratio <= 0.25:  return GH_GREENS[1]
            if ratio <= 0.50:  return GH_GREENS[2]
            if ratio <= 0.75:  return GH_GREENS[3]
            return GH_GREENS[4]

          # SVG dimensions
          W, H     = 900, 160
          WAVE_H   = 120
          TOP_PAD  = 10
          n        = len(counts)
          step     = W / max(n - 1, 1)

          def y_for(count):
            ratio = count / peak
            return TOP_PAD + WAVE_H * (1 - ratio)

          pts = [(i * step, y_for(c)) for i, c in enumerate(counts)]

          def smooth_path(pts):
            if not pts:
              return ""
            d = f"M {pts[0][0]:.2f},{pts[0][1]:.2f}"
            for i in range(1, len(pts)):
              x0, y0 = pts[i - 1]
              x1, y1 = pts[i]
              cx = (x0 + x1) / 2
              d += f" C {cx:.2f},{y0:.2f} {cx:.2f},{y1:.2f} {x1:.2f},{y1:.2f}"
            return d

          wave_d     = smooth_path(pts)
          baseline_y = TOP_PAD + WAVE_H
          fill_d     = wave_d + f" L {W},{baseline_y} L 0,{baseline_y} Z"

          # Build gradient stops based on actual contribution density across the year
          # Divide the year into segments and pick the GitHub green for each segment
          NUM_STOPS = 20
          seg_size  = max(1, n // NUM_STOPS)
          grad_stops = ""
          for s in range(NUM_STOPS + 1):
            idx   = min(s * seg_size, n - 1)
            pct   = round(s * 100 / NUM_STOPS)
            color = gh_color(counts[idx])
            grad_stops += f'<stop offset="{pct}%" stop-color="{color}" stop-opacity="0.9"/>\n            '

          # Vertical gradient: top = darkest green of that segment, bottom = transparent
          # We use a second vertical gradient overlaid for the fade-to-transparent effect
          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
               width="{W}" height="{H}"
               viewBox="0 0 {W} {H}">

            <defs>
              <!-- Horizontal gradient based on contribution density -->
              <linearGradient id="waveHoriz" x1="0" y1="0" x2="1" y2="0">
                {grad_stops}
              </linearGradient>

              <!-- Vertical fade: opaque at top, transparent at bottom -->
              <linearGradient id="waveFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="white" stop-opacity="1"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
              </linearGradient>

              <!-- Multiply the two gradients together via a mask -->
              <mask id="fadeMask">
                <rect width="{W}" height="{H}" fill="url(#waveFade)"/>
              </mask>

              <!-- Glow filter for the wave stroke -->
              <filter id="glow" x="-5%" y="-50%" width="110%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <clipPath id="wave-clip">
                <rect width="{W}" height="{H}"/>
              </clipPath>
            </defs>

            <!-- Transparent background -->

            <g clip-path="url(#wave-clip)">

              <!-- Filled wave area with horizontal density gradient + vertical fade -->
              <path d="{fill_d}" fill="url(#waveHoriz)" mask="url(#fadeMask)">
                <animate attributeName="opacity"
                         values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
              </path>

              <!-- Wave top line with glow -->
              <path d="{wave_d}"
                    fill="none"
                    stroke="#39d353"
                    stroke-width="2"
                    stroke-linejoin="round"
                    filter="url(#glow)">
                <animate attributeName="stroke-opacity"
                         values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
              </path>

            </g>
          </svg>"""

          os.makedirs("dist", exist_ok=True)
          with open("dist/contribution-wave.svg", "w") as f:
            f.write(svg)

          print(f"Wave SVG generated — {n} days plotted, peak={peak}")
          EOF

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution wave [skip ci]"
